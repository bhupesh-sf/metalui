name: Feature or component request
description: Something MetalUI should do or ship
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: { label: What are you trying to do, description: "Describe the job, not the solution. What is in the way today?" }
    validations: { required: true }
  - type: textarea
    id: idea
    attributes: { label: What would you like to see, description: "Optional: how it might work, and what you use now." }
