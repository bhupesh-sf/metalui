[project]
name = "launch-video-music"
version = "0.1.0"
description = "Reads a track into a beat grid, bars, drums and sections, cuts a bar-true edit, and writes the cues the video runs on."
requires-python = ">=3.10"
dependencies = [
  "librosa==0.11.0",
  "soundfile>=0.12",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "scipy>=1.11",
]

[tool.uv]
package = false
