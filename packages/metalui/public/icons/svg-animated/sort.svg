<svg xmlns="http://www.w3.org/2000/svg" class="mu-icon mu-ic-sort" width="24" height="24" viewBox="0 0 24 24">
<!-- MetalUI icon: Sort. Hover: The up arrow is pushed up and the down arrow answers, pushed down: they pass like rows changing places.. Press (:active or data-state="press"): plays the same act. Reduced motion: static. -->
<style>
.mu-icon{--sw:1.7;--k-spring:linear(0,0.0117,0.0435,0.0909,0.1499,0.217,0.2892,0.3637,0.4386,0.512,0.5826,0.6494,0.7114,0.7683,0.8196,0.8654,0.9056,0.9403,0.9698,0.9944,1.0145,1.0305,1.0428,1.0518,1.0579,1.0616,1.0632,1.063,1.0615,1.0588,1.0554,1.0513,1.0468,1.0422,1.0374,1.0327,1.0282,1.0238,1.0198,1.0161,1.0127,1.0096,1.007,1.0046,1);--k-soft:linear(0,0.0063,0.0235,0.0493,0.0818,0.1194,0.1605,0.2042,0.2492,0.2949,0.3406,0.3856,0.4297,0.4723,0.5133,0.5525,0.5898,0.625,0.6581,0.6892,0.7181,0.745,0.77,0.793,0.8142,0.8337,0.8515,0.8678,0.8826,0.896,0.9082,0.9192,0.9291,0.938,0.9459,0.953,0.9594,0.965,0.97,0.9745,0.9784,0.9818,0.9848,0.9874,1);--k-dur:.46s;flex:none;overflow:visible;fill:none;stroke:currentColor;stroke-width:var(--sw);stroke-linecap:round;stroke-linejoin:round}
.mu-icon *{transform-box:view-box}
.mu-icon .f{fill:currentColor;fill-opacity:calc(var(--duo,.14) * var(--mu-duo-k,1))}
.mu-icon .s{fill:currentColor;stroke:none}
.mu-icon .d{fill:currentColor;fill-opacity:calc(var(--duo,.14) * var(--mu-duo-k,1));stroke:none}
@media (prefers-reduced-motion:no-preference){
.mu-icon *{transition:transform var(--k-dur) var(--k-spring) var(--dl,0s),opacity .2s ease var(--dl,0s),d var(--k-dur) var(--k-spring) var(--dl,0s),stroke-dashoffset var(--k-dur) var(--k-spring) var(--dl,0s),fill-opacity .2s ease}
}
svg.mu-icon [data-part="up"]{transform-origin:9.4px 12px}svg.mu-icon [data-part="down"]{transform-origin:14.6px 12px}svg.mu-icon [data-part="puff"]{transform-origin:9.4px 17.6px}
@media (prefers-reduced-motion:no-preference){svg.mu-icon:is(:hover,:focus-visible,[data-state~="play"]) [data-part="up"]{animation:mu-sort-up 585ms linear both}@keyframes mu-sort-up{0%{transform:translate(0px,0px) rotate(0deg) scale(1,1);animation-timing-function:cubic-bezier(.55,0,.85,.45)}23.932%{transform:translate(0px,0.8px) rotate(0deg) scale(1,0.9);animation-timing-function:cubic-bezier(.16,.75,.3,.95)}37.607%{transform:translate(0px,-1.1px) rotate(0deg) scale(1,1.04);animation-timing-function:cubic-bezier(.37,0,.63,1)}89.744%{transform:translate(0px,0px) rotate(0deg) scale(1,1)}100%{transform:translate(0px,0px) rotate(0deg) scale(1,1);animation-timing-function:cubic-bezier(.4,0,.2,1)}}svg.mu-icon:is(:hover,:focus-visible,[data-state~="play"]) [data-part="down"]{animation:mu-sort-down 585ms linear both}@keyframes mu-sort-down{0%{transform:translate(0px,0px) rotate(0deg) scale(1,1);animation-timing-function:linear}10.256%{transform:translate(0px,0px) rotate(0deg) scale(1,1);animation-timing-function:cubic-bezier(.55,0,.85,.45)}34.188%{transform:translate(0px,-0.8px) rotate(0deg) scale(1,0.9);animation-timing-function:cubic-bezier(.16,.75,.3,.95)}47.863%{transform:translate(0px,1.1px) rotate(0deg) scale(1,1.04);animation-timing-function:cubic-bezier(.37,0,.63,1)}100%{transform:translate(0px,0px) rotate(0deg) scale(1,1)}}svg.mu-icon:is(:hover,:focus-visible,[data-state~="play"]) [data-part="puff"]{animation:mu-sort-puff 585ms linear both}@keyframes mu-sort-puff{0%{transform:scale(.5);opacity:0}34.188%{transform:scale(.5);opacity:0;animation-timing-function:cubic-bezier(.22,1,.36,1)}42.735%{transform:scale(1);opacity:0.85;animation-timing-function:cubic-bezier(.4,0,.2,1)}76.923%{transform:scale(1.4);opacity:0}100%{transform:scale(.5);opacity:0}}}</style>
